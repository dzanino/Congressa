<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Congressa - program konferencie</title>
<link rel="icon" href="assets/icon-256.png">
<!--
  Spoločný odkaz z QR kódu a pozvánky (iPhone, iPad, Mac aj Android):
    open.html?kind=server|web&url=<adresa programu alebo webu konferencie>
  • Android: intent:// otvorí Congressu, ak je nainštalovaná; inak Google Play s parametrom referrer -
    appka si ho po inštalácii prečíta (Install Referrer) a načíta ten istý program.
  • iPhone/iPad: Smart App Banner + tlačidlo „Otvoriť v Congresse“ (congressa://). Pred cestou do App Store
    sa odkaz skopíruje do schránky - Congressa ho po prvom spustení ponúkne načítať.
  • Počítač: odkazy do oboch obchodov a adresa programu.
  Formát congressa:// je rovnaký ako v appkách (ProgramShare.swift / ProgramShare.kt).
-->
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var k = q.get('kind');
  var kind = k === 'web' ? 'web' : (k === 'organizer' ? 'organizer' : 'server');
  var url = q.get('url') || '';
  // Pozvánka organizátora (kind=organizer): len https (heslo sa bude písať na tejto adrese).
  var ok = kind === 'organizer' ? /^https:\/\/[^\s\/]+/i.test(url) : /^https?:\/\/[^\s\/]+/i.test(url);
  var deep = kind === 'organizer' ? 'congressa://organizer?url=' + encodeURIComponent(url)
    : 'congressa://import?kind=' + encodeURIComponent(kind) + '&url=' + encodeURIComponent(url);
  window.CONGRESSA = { kind: kind, url: url, ok: ok, deep: deep };
  // Smart App Banner musí byť v <head> už pri načítaní - iOS potom pošle app-argument priamo do appky.
  if (ok) document.write('<meta name="apple-itunes-app" content="app-id=6809326421, app-argument=' + deep.replace(/"/g, '&quot;') + '">');
})();
</script>
<style>
  :root{--ink:#0f172a;--muted:#64748b;--brand:#0B0E9D;--bg:#f6f7fb;--card:#fff;--line:#e5e7ef}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg);line-height:1.5}
  main{max-width:520px;margin:0 auto;padding:28px 18px 40px}
  .top{display:flex;align-items:center;gap:12px;margin-bottom:18px}
  .top img{width:52px;height:52px;border-radius:12px}
  .top b{font-size:22px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin:14px 0}
  h1{font-size:22px;margin:0 0 6px}
  p{margin:6px 0;color:var(--muted)}
  .btn{display:block;text-align:center;padding:14px 16px;border-radius:12px;background:var(--brand);color:#fff;text-decoration:none;font-weight:600;font-size:17px;margin:10px 0;border:0;width:100%;cursor:pointer;font-family:inherit}
  .btn.sec{background:#fff;color:var(--brand);border:1px solid var(--line)}
  code{font-size:13px;word-break:break-all;background:#eef0fb;padding:2px 6px;border-radius:6px;color:var(--ink)}
  .small{font-size:13px}
  .hide{display:none}
  .badges{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
  .badges img{height:44px}
  footer{font-size:12px;color:var(--muted);text-align:center;margin-top:24px}
</style>
</head>
<body>
<main>
  <div class="top"><img src="assets/icon-256.png" alt=""><b>Congressa</b></div>

  <div class="card">
    <h1 id="t-title"></h1>
    <p id="t-lead"></p>
    <p class="small"><span id="t-address"></span> <code id="addr"></code></p>
  </div>

  <div class="card" id="box-android">
    <a class="btn" id="a-open-android" href="#"></a>
    <a class="btn sec" id="a-play" href="#"></a>
    <p class="small" id="t-android"></p>
  </div>

  <div class="card" id="box-ios">
    <a class="btn" id="a-open-ios" href="#"></a>
    <button class="btn sec" id="b-appstore" type="button"></button>
    <p class="small" id="t-ios"></p>
  </div>

  <div class="card" id="box-desktop">
    <p id="t-desktop"></p>
    <div class="badges">
      <a id="d-appstore" href="https://apps.apple.com/app/id6809326421"><img src="assets/appstore-badge.svg" alt="App Store"></a>
      <a id="d-play" href="https://play.google.com/store/apps/details?id=sk.sikuta.congressa"><img src="assets/google-play-badge.png" alt="Google Play"></a>
    </div>
  </div>

  <div class="card hide" id="box-web">
    <a class="btn sec" id="a-web-admin" href="#"></a>
    <p class="small" id="t-web"></p>
  </div>

  <div class="card hide" id="box-bad"><p id="t-bad"></p></div>

  <p class="small" id="t-indep"></p>
  <footer><a href="index.html">Congressa</a> · <a href="privacy.html" id="t-privacy"></a></footer>
</main>

<script>
(function () {
  var T = {
    sk: {title:'Program konferencie v Congresse', lead:'Otvorte ho v aplikácii Congressa - program budete mať v telefóne aj offline, s pripomienkami pred prednáškami.', address:'Adresa programu:', open:'Otvoriť v Congresse', play:'Stiahnuť z Google Play', appstore:'Stiahnuť z App Store', android:'Ak Congressu ešte nemáte, Google Play ju nainštaluje a po prvom otvorení sa program načíta sám.', ios:'Ak Congressu ešte nemáte: stiahnite ju, otvorte a ťuknite na „Vložiť odkaz na program“ - odkaz sme skopírovali. Alebo sa po inštalácii vráťte na túto stránku a ťuknite na „Otvoriť v Congresse“.', desktop:'Otvorte túto stránku v telefóne (iPhone alebo Android), alebo si stiahnite Congressu:', bad:'Odkaz neobsahuje adresu programu. Požiadajte o nový QR kód.', indep:'Congressa je nezávislá aplikácia - nevyrába ju organizátor konferencie. Je zadarmo, bez reklám a bez účtu.', privacy:'Ochrana súkromia'},
    cs: {title:'Program konference v Congresse', lead:'Otevřete ho v aplikaci Congressa - program budete mít v telefonu i offline, s připomínkami před přednáškami.', address:'Adresa programu:', open:'Otevřít v Congresse', play:'Stáhnout z Google Play', appstore:'Stáhnout z App Store', android:'Pokud Congressu ještě nemáte, Google Play ji nainstaluje a po prvním otevření se program načte sám.', ios:'Pokud Congressu ještě nemáte: stáhněte ji, otevřete a klepněte na „Vložit odkaz na program“ - odkaz jsme zkopírovali. Nebo se po instalaci vraťte na tuto stránku a klepněte na „Otevřít v Congresse“.', desktop:'Otevřete tuto stránku v telefonu (iPhone nebo Android), nebo si stáhněte Congressu:', bad:'Odkaz neobsahuje adresu programu. Požádejte o nový QR kód.', indep:'Congressa je nezávislá aplikace - nevyrábí ji pořadatel konference. Je zdarma, bez reklam a bez účtu.', privacy:'Ochrana soukromí'},
    en: {title:'Conference programme in Congressa', lead:'Open it in the Congressa app - you will have the programme on your phone, offline, with reminders before each talk.', address:'Programme address:', open:'Open in Congressa', play:'Get it on Google Play', appstore:'Download on the App Store', android:'If you do not have Congressa yet, Google Play installs it and the programme loads by itself the first time you open it.', ios:'If you do not have Congressa yet: download it, open it and tap “Paste programme link” - we copied the link for you. Or come back to this page after installing and tap “Open in Congressa”.', desktop:'Open this page on your phone (iPhone or Android), or download Congressa:', bad:'This link does not contain a programme address. Please ask for a new QR code.', indep:'Congressa is an independent app - it is not made by the conference organiser. It is free, with no ads and no account.', privacy:'Privacy'},
    de: {title:'Konferenzprogramm in Congressa', lead:'Öffnen Sie es in der App Congressa - das Programm ist dann offline auf Ihrem Telefon, mit Erinnerungen vor jedem Vortrag.', address:'Adresse des Programms:', open:'In Congressa öffnen', play:'Bei Google Play laden', appstore:'Im App Store laden', android:'Wenn Sie Congressa noch nicht haben, installiert Google Play die App und das Programm lädt beim ersten Öffnen von selbst.', ios:'Wenn Sie Congressa noch nicht haben: laden, öffnen und auf „Programm-Link einfügen“ tippen - wir haben den Link kopiert. Oder nach der Installation zu dieser Seite zurückkehren und „In Congressa öffnen“ tippen.', desktop:'Öffnen Sie diese Seite auf Ihrem Telefon (iPhone oder Android) oder laden Sie Congressa:', bad:'Dieser Link enthält keine Programmadresse. Bitte fordern Sie einen neuen QR-Code an.', indep:'Congressa ist eine unabhängige App - sie stammt nicht vom Veranstalter der Konferenz. Kostenlos, ohne Werbung und ohne Konto.', privacy:'Datenschutz'},
    fr: {title:'Programme du congrès dans Congressa', lead:'Ouvrez-le dans l’app Congressa - le programme sera sur votre téléphone, même hors ligne, avec des rappels avant chaque intervention.', address:'Adresse du programme :', open:'Ouvrir dans Congressa', play:'Disponible sur Google Play', appstore:'Télécharger dans l’App Store', android:'Si vous n’avez pas encore Congressa, Google Play l’installe et le programme se charge tout seul à la première ouverture.', ios:'Si vous n’avez pas encore Congressa : téléchargez-la, ouvrez-la et touchez « Coller le lien du programme » - nous avons copié le lien. Ou revenez sur cette page après l’installation et touchez « Ouvrir dans Congressa ».', desktop:'Ouvrez cette page sur votre téléphone (iPhone ou Android), ou téléchargez Congressa :', bad:'Ce lien ne contient pas d’adresse de programme. Demandez un nouveau QR code.', indep:'Congressa est une app indépendante - elle n’est pas éditée par l’organisateur du congrès. Gratuite, sans publicité et sans compte.', privacy:'Confidentialité'},
    es: {title:'Programa del congreso en Congressa', lead:'Ábralo en la app Congressa: tendrá el programa en el teléfono, también sin conexión, con avisos antes de cada ponencia.', address:'Dirección del programa:', open:'Abrir en Congressa', play:'Disponible en Google Play', appstore:'Descargar en el App Store', android:'Si aún no tiene Congressa, Google Play la instala y el programa se carga solo la primera vez que la abra.', ios:'Si aún no tiene Congressa: descárguela, ábrala y toque «Pegar enlace del programa» - hemos copiado el enlace. O vuelva a esta página tras instalarla y toque «Abrir en Congressa».', desktop:'Abra esta página en su teléfono (iPhone o Android) o descargue Congressa:', bad:'Este enlace no contiene la dirección de un programa. Pida un nuevo código QR.', indep:'Congressa es una app independiente: no la hace el organizador del congreso. Es gratuita, sin anuncios y sin cuenta.', privacy:'Privacidad'},
    it: {title:'Programma del congresso in Congressa', lead:'Aprilo nell’app Congressa: avrai il programma sul telefono, anche offline, con promemoria prima di ogni relazione.', address:'Indirizzo del programma:', open:'Apri in Congressa', play:'Disponibile su Google Play', appstore:'Scarica dall’App Store', android:'Se non hai ancora Congressa, Google Play la installa e il programma si carica da solo alla prima apertura.', ios:'Se non hai ancora Congressa: scaricala, aprila e tocca «Incolla link del programma» - abbiamo copiato il link. Oppure torna su questa pagina dopo l’installazione e tocca «Apri in Congressa».', desktop:'Apri questa pagina sul telefono (iPhone o Android) oppure scarica Congressa:', bad:'Questo link non contiene l’indirizzo di un programma. Chiedi un nuovo codice QR.', indep:'Congressa è un’app indipendente: non è realizzata dall’organizzatore del congresso. Gratuita, senza pubblicità e senza account.', privacy:'Privacy'},
    uk: {title:'Програма конференції в Congressa', lead:'Відкрийте її в застосунку Congressa - програма буде у вашому телефоні навіть офлайн, з нагадуваннями перед кожною доповіддю.', address:'Адреса програми:', open:'Відкрити в Congressa', play:'Завантажити з Google Play', appstore:'Завантажити з App Store', android:'Якщо у вас ще немає Congressa, Google Play її встановить, і програма завантажиться сама під час першого відкриття.', ios:'Якщо у вас ще немає Congressa: завантажте її, відкрийте й торкніться «Вставити посилання на програму» - ми скопіювали посилання. Або після встановлення поверніться на цю сторінку й торкніться «Відкрити в Congressa».', desktop:'Відкрийте цю сторінку в телефоні (iPhone або Android) або завантажте Congressa:', bad:'Посилання не містить адреси програми. Попросіть новий QR-код.', indep:'Congressa - незалежний застосунок, його не створює організатор конференції. Безкоштовно, без реклами й без облікового запису.', privacy:'Конфіденційність'}
  };
  // Pozvánka organizátora hostovanej konferencie (kind=organizer) - SK/CS/EN, ostatné jazyky po anglicky.
  var O = {
    sk: {title:'Administrácia konferencie', lead:'Dostali ste prístup na správu konferencie v Congresse: program, oznámenia, prihlášky, ankety a hlasovanie.', address:'Adresa konferencie:', open:'Prihlásiť sa v Congresse', ios:'Otvorí sa prihlásenie v aplikácii s vyplnenou adresou - stačí zadať heslo, ktoré ste dostali zvlášť. Ak Congressu ešte nemáte, stiahnite ju z App Store a potom sa vráťte na túto stránku.', web:'Webová administrácia', webText:'Funguje v každom prehliadači, aj na Androide a počítači. Prihlásite sa tým istým heslom.', bad:'Odkaz neobsahuje adresu konferencie. Požiadajte o novú pozvánku.'},
    cs: {title:'Administrace konference', lead:'Dostali jste přístup ke správě konference v Congresse: program, oznámení, přihlášky, ankety a hlasování.', address:'Adresa konference:', open:'Přihlásit se v Congresse', ios:'Otevře se přihlášení v aplikaci s vyplněnou adresou - stačí zadat heslo, které jste dostali zvlášť. Pokud Congressu ještě nemáte, stáhněte ji z App Store a pak se vraťte na tuto stránku.', web:'Webová administrace', webText:'Funguje v každém prohlížeči, i na Androidu a počítači. Přihlásíte se stejným heslem.', bad:'Odkaz neobsahuje adresu konference. Požádejte o novou pozvánku.'},
    en: {title:'Conference administration', lead:'You have been given access to manage a conference in Congressa: programme, notifications, registrations, polls and voting.', address:'Conference address:', open:'Sign in in Congressa', ios:'This opens the sign-in in the app with the address filled in - just enter the password you received separately. If you do not have Congressa yet, download it from the App Store and come back to this page.', web:'Web administration', webText:'Works in any browser, also on Android and a computer. Sign in with the same password.', bad:'This link does not contain a conference address. Please ask for a new invitation.'}
  };
  var langs = (navigator.languages || [navigator.language || 'en']).map(function (l) { return (l || '').slice(0, 2).toLowerCase(); });
  var lang = 'en';
  for (var i = 0; i < langs.length; i++) { if (T[langs[i]]) { lang = langs[i]; break; } }
  var L = T[lang];
  document.documentElement.lang = lang;
  function $(id) { return document.getElementById(id); }
  function set(id, text) { var e = $(id); if (e) e.textContent = text; }

  var C = window.CONGRESSA;
  var ua = navigator.userAgent || '';
  var android = /Android/i.test(ua);
  var ios = /iPhone|iPad|iPod/i.test(ua) || (/Macintosh/i.test(ua) && navigator.maxTouchPoints > 1);

  set('t-title', L.title); set('t-lead', L.lead); set('t-address', L.address); set('addr', C.url);
  set('a-open-android', L.open); set('a-play', L.play); set('t-android', L.android);
  set('a-open-ios', L.open); set('b-appstore', L.appstore); set('t-ios', L.ios);
  set('t-desktop', L.desktop); set('t-bad', L.bad); set('t-indep', L.indep); set('t-privacy', L.privacy);

  if (C.kind === 'organizer') {
    var OL = O[lang] || O.en;
    set('t-title', OL.title); set('t-lead', OL.lead); set('t-address', OL.address); set('t-bad', OL.bad);
    set('a-open-ios', OL.open); set('t-ios', OL.ios); set('a-web-admin', OL.web); set('t-web', OL.webText);
    $('box-android').classList.add('hide');
    if (!C.ok) { $('box-ios').classList.add('hide'); $('box-desktop').classList.add('hide'); $('box-bad').classList.remove('hide'); return; }
    $('a-web-admin').href = C.url.replace(/\/+$/, '') + '/admin';
    $('box-web').classList.remove('hide');
    if (ios) { $('box-desktop').classList.add('hide'); $('a-open-ios').href = C.deep; $('b-appstore').addEventListener('click', function () { location.href = 'https://apps.apple.com/app/id6809326421'; }); }
    else if (/Macintosh/i.test(ua)) { $('box-ios').classList.remove('hide'); $('box-desktop').classList.add('hide'); $('a-open-ios').href = C.deep; $('b-appstore').addEventListener('click', function () { location.href = 'https://apps.apple.com/app/id6809326421?platform=mac'; }); }
    else { $('box-ios').classList.add('hide'); $('box-desktop').classList.add('hide'); }
    return;
  }

  var PLAY = 'https://play.google.com/store/apps/details?id=sk.sikuta.congressa';
  var APPSTORE = 'https://apps.apple.com/app/id6809326421';
  // Google Play odovzdá „referrer" appke po inštalácii (Install Referrer API) - appka z neho vyberie congressa_link.
  var playRef = PLAY + '&referrer=' + encodeURIComponent('congressa_link=' + encodeURIComponent(C.deep));
  var intent = 'intent://import?kind=' + encodeURIComponent(C.kind) + '&url=' + encodeURIComponent(C.url) +
    '#Intent;scheme=congressa;package=sk.sikuta.congressa;S.browser_fallback_url=' + encodeURIComponent(playRef) + ';end';

  if (!C.ok) {
    ['box-android', 'box-ios'].forEach(function (id) { $(id).classList.add('hide'); });
    $('box-bad').classList.remove('hide');
    return;
  }
  $('d-play').href = playRef;
  if (android) {
    $('box-ios').classList.add('hide'); $('box-desktop').classList.add('hide');
    $('a-open-android').href = intent;
    $('a-play').href = playRef;
    // Raz automaticky: s Congressou sa otvorí program, bez nej Google Play.
    if (!sessionStorage.getItem('congressa-tried')) { sessionStorage.setItem('congressa-tried', '1'); location.href = intent; }
  } else if (ios) {
    $('box-android').classList.add('hide'); $('box-desktop').classList.add('hide');
    $('a-open-ios').href = C.deep;
    $('b-appstore').addEventListener('click', function () {
      // Odkaz do schránky - Congressa ho po prvom spustení ponúkne („Vložiť odkaz na program").
      var go = function () { location.href = APPSTORE; };
      try { navigator.clipboard.writeText(location.href).then(go, go); } catch (e) { go(); }
    });
  } else {
    $('box-android').classList.add('hide'); $('box-ios').classList.add('hide');
  }
})();
</script>
</body>
</html>
