<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Congressa - stiahnuť aplikáciu</title>
<meta name="description" content="Congressa zadarmo pre iPhone, iPad, Mac a Android. Tento odkaz vás pošle do správneho obchodu.">
<meta name="apple-itunes-app" content="app-id=6809326421">
<link rel="icon" href="assets/icon-256.png">
<style>
  :root{--ink:#0f172a;--muted:#64748b;--brand:#0B0E9D;--bg:#f6f7fb;--line:#e5e7ef}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg);line-height:1.5}
  main{max-width:460px;margin:0 auto;padding:48px 20px;text-align:center}
  img.icon{width:96px;height:96px;border-radius:22px;box-shadow:0 10px 30px rgba(11,14,157,.2)}
  h1{font-size:26px;margin:18px 0 6px}
  p{color:var(--muted);margin:0 0 22px}
  .stores{display:flex;flex-direction:column;align-items:center;gap:12px}
  .stores img{height:48px;display:block}
  .stores img.gp{height:72px;margin:-12px -10px}
  .note{font-size:13px;margin-top:26px}
  a{color:var(--brand)}
</style>
<link rel="stylesheet" href="glam.css?v=20261017">
</head>
<body>
<main>
  <img class="icon" src="assets/icon-256.png" alt="Congressa">
  <h1>Congressa</h1>
  <p id="lead">Program konferencie vo vrecku. Zadarmo pre iPhone, iPad, Mac a Android.</p>
  <div class="stores">
    <a id="as" href="https://apps.apple.com/app/congressa/id6809326421"><img src="assets/appstore-badge.svg" alt="Download on the App Store"></a>
    <a id="gp" href="https://play.google.com/store/apps/details?id=sk.sikuta.congressa"><img class="gp" src="assets/google-play-badge.png" alt="Get it on Google Play"></a>
  </div>
  <p class="note"><a href="index.html" id="more">Viac o aplikácii</a></p>
</main>
<script>
// Jeden odkaz / QR kód pre všetkých: Android → Google Play, iPhone/iPad/Mac → App Store, inak zostane voľba.
(function () {
  var ua = navigator.userAgent || '';
  var AS = 'https://apps.apple.com/app/congressa/id6809326421';
  var GP = 'https://play.google.com/store/apps/details?id=sk.sikuta.congressa';
  var TX = {
    sk: ['Program konferencie vo vrecku. Zadarmo pre iPhone, iPad, Mac a Android.', 'Viac o aplikácii'],
    cs: ['Program konference v kapse. Zdarma pro iPhone, iPad, Mac a Android.', 'Více o aplikaci'],
    en: ['Your conference programme in your pocket. Free for iPhone, iPad, Mac and Android.', 'More about the app'],
    de: ['Ihr Konferenzprogramm in der Tasche. Kostenlos für iPhone, iPad, Mac und Android.', 'Mehr über die App'],
    fr: ['Le programme de votre congrès dans la poche. Gratuit sur iPhone, iPad, Mac et Android.', 'En savoir plus sur l’app'],
    es: ['El programa de su congreso en el bolsillo. Gratis para iPhone, iPad, Mac y Android.', 'Más información sobre la app'],
    it: ['Il programma del congresso in tasca. Gratis per iPhone, iPad, Mac e Android.', 'Scopri di più sull’app'],
    uk: ['Програма конференції в кишені. Безкоштовно для iPhone, iPad, Mac і Android.', 'Докладніше про застосунок'],
    hu: ['A konferenciaprogram a zsebében. Ingyenes iPhone-ra, iPadre, Macre és Androidra.', 'Többet az alkalmazásról'],
    pl: ['Program konferencji w kieszeni. Bezpłatnie na iPhone, iPad, Mac i Androida.', 'Więcej o aplikacji'],
    zh: ['会议日程，随身携带。iPhone、iPad、Mac 和 Android 免费使用。', '了解更多'],
    ja: ['カンファレンスのプログラムをポケットに。iPhone、iPad、Mac、Android で無料。', 'アプリについて詳しく'],
    ko: ['학술대회 프로그램을 주머니 속에. iPhone, iPad, Mac, Android에서 무료.', '앱 자세히 보기']
  };
  var nl = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || 'en'];
  var lg = 'en';
  for (var i = 0; i < nl.length; i++) { var c = (nl[i] || '').slice(0, 2).toLowerCase(); if (TX[c]) { lg = c; break; } }
  document.documentElement.lang = lg;
  document.getElementById('lead').textContent = TX[lg][0];
  document.getElementById('more').textContent = TX[lg][1];
  if (/Android/i.test(ua)) { location.replace(GP); }
  else if (/iPhone|iPad|iPod/i.test(ua) || (/Macintosh/i.test(ua) && navigator.maxTouchPoints > 1)) { location.replace(AS); }
})();
</script>
</body>
</html>
